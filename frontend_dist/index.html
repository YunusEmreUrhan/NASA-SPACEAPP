    function fmt(v, d = 1) {
      if (v === null || v === undefined || v === "" || Number.isNaN(Number(v))) return "N/A";
      return Number(v).toFixed(d);
    }

    function fmtPct(v, d = 1, lang = "TR") {
      const num = fmt(v, d);
      if (num === "N/A") return "N/A";
      return lang === "TR" ? "%" + num : num + "%";
    }

    // ============================================================================
    // DERIN INGILIZCE CEVIRI KATMANI (ARKA UCTAN GELEN TUM TURKCE VERILER ICIN)
    // ============================================================================
    function trTargetName(name, lang) {
      if (!name || lang === "TR") return name || "";
      return String(name)
        .replace(/Se\u00E7ili Koordinat/gi, "Selected Coordinate")
        .replace(/Hedef Koordinat/gi, "Target Coordinate")
        .replace(/Serbest Koordinat/gi, "Free Coordinate")
        .replace(/\(Ay\)/gi, "(Moon)")
        .replace(/Kal\u0131c\u0131 \u00DCs/gi, "Permanent Base");
    }

    function trGeneralTokens(str, lang) {
      if (!str || lang === "TR") return str || "";
      return String(str)
        .replace(/Se\u00E7ili Koordinat/gi, "Selected Coordinate")
        .replace(/Do\u011Frudan Uydu \u00D6l\u00E7\u00FCm\u00FC/gi, "Tier-1: Direct Satellite Measurement")
        .replace(/Do\u011Frudan DEM \u00D6l\u00E7\u00FCm\u00FC/gi, "Tier-1: Direct DEM Measurement")
        .replace(/Do\u011Frudan \u00D6l\u00E7\u00FCm/gi, "Direct Measurement")
        .replace(/Fiziksel Model \/ T\u00FCretilmi\u015F/gi, "Tier-2: Physics-Derived Model")
        .replace(/T\u00FCretilmi\u015F \u0130ndeks/gi, "Tier-2: Derived Geophysical Index")
        .replace(/Gezegensel Sabit \/ Ba\u011Flam/gi, "Tier-3: Planetary Reference Constant")
        .replace(/Ba\u011Flam Verisi/gi, "Context Reference")
        .replace(/\u00D6l\u00E7\u00FClm\u00FC\u015F/gi, "Measured")
        .replace(/Tahmini/gi, "Estimated")
        .replace(/Y\u00FCksek Vakum/gi, "Hard Vacuum")
        .replace(/Ultra-Y\u00FCksek Vakum/gi, "Ultra-High Vacuum")
        .replace(/Vakum/gi, "Vacuum")
        .replace(/Manyetosfer Korumal\u0131/gi, "Magnetosphere Shielded")
        .replace(/Atmosfer Korumal\u0131/gi, "Atmosphere Shielded")
        .replace(/Korumas\u0131z/gi, "Unshielded")
        .replace(/mSv\/y\u0131l/gi, "mSv/yr")
        .replace(/mm\/g\u00FCn/gi, "mm/day")
        .replace(/kWh\/m\u00B2\/g\u00FCn/gi, "kWh/m\u00B2/day")
        .replace(/g\u00FCn/gi, "day")
        .replace(/y\u0131l/gi, "yr")
        .replace(/Birincil/gi, "Primary")
        .replace(/\u0130kincil/gi, "Secondary")
        .replace(/Tamamlay\u0131c\u0131/gi, "Complementary")
        .replace(/Yeni Ke\u015Fif/gi, "Novel Discovery")
        .replace(/Klasik Analog/gi, "Classic Analog");
    }

    function trCriterionName(crit, lang) {
      if (!crit || lang === "TR") return crit || "";
      const c = String(crit);
      const low = c.toLowerCase();
      if (low.includes("e\u011fim") || low.includes("slope")) return "Topographic Slope (SRTM 90m vs LOLA/MOLA)";
      if (low.includes("r\u00F6lyef") || low.includes("relief") || low.includes("engebe")) return "Vertical Relief & Surface Roughness";
      if (low.includes("s\u0131cakl\u0131k") || low.includes("temp") || low.includes("termal")) return "Mean Surface Temperature (NASA POWER)";
      if (low.includes("ya\u011F\u0131\u015F") || low.includes("kurakl\u0131k") || low.includes("precip") || low.includes("arid")) return "Hyper-Aridity & Daily Precipitation";
      if (low.includes("albedo") || low.includes("bazalt") || low.includes("litoloji")) return "Basaltic Albedo & Lithology Index";
      if (low.includes("g\u00FCne\u015F") || low.includes("solar") || low.includes("uv") || low.includes("\u0131\u015F\u0131n\u0131m")) return "Solar Irradiance & UV Flux";
      if (low.includes("buz") || low.includes("kriyo") || low.includes("isru") || low.includes("ice")) return "Subsurface Water Ice / Cryosphere (ISRU)";
      if (low.includes("yer\u00E7ekim") || low.includes("k\u00FCtle\u00E7ekim") || low.includes("gravity")) return "Surface Gravity Acceleration (g)";
      if (low.includes("bas\u0131n\u00E7") || low.includes("atmosfer") || low.includes("pressure")) return "Atmospheric Surface Pressure";
      if (low.includes("radyasyon") || low.includes("radiation") || low.includes("kozmik")) return "Ionizing Surface Radiation Dose";
      if (low.includes("r\u00FCzgar") || low.includes("wind")) return "Near-Surface Wind Speed (10m)";
      return trGeneralTokens(c, "EN");
    }

    function trXaiBreakdownItem(brk, targetBody, lang) {
      if (!brk || lang === "TR") return brk;
      const pLow = String(brk.parameter || "").toLowerCase();
      const sLow = String(brk.severity || "").toLowerCase();
      let severityEn = "PHYSICAL ANALOG LIMIT";
      if (sLow.includes("kritik") || sLow.includes("critical")) severityEn = "CRITICAL PHYSICAL LIMIT (NON-SIMULATABLE ON EARTH)";
      else if (sLow.includes("y\u00FCksek") || sLow.includes("high")) severityEn = "HIGH ENGINEERING DELTA";
      else if (sLow.includes("orta") || sLow.includes("mod")) severityEn = "MODERATE ENVIRONMENTAL DELTA";
      else if (sLow.includes("d\u00FC\u015F\u00FCk") || sLow.includes("low")) severityEn = "LOW TOPOGRAPHIC DELTA";

      const tVal = trGeneralTokens(brk.target_value, "EN");
      const eVal = trGeneralTokens(brk.earth_value, "EN");

      if (pLow.includes("yer\u00E7ekim") || pLow.includes("k\u00FCtle\u00E7ekim") || pLow.includes("gravity") || pLow.includes("(g)")) {
        return {
          ...brk,
          parameter: "Surface Gravity Acceleration (g)",
          severity: severityEn,
          target_value: tVal,
          earth_value: eVal,
          impact: "Earth\u2019s 9.81 m/s\u00B2 (1.0g) gravity increases rover wheel sinkage, soil shear strength, excavation torque, and structural settling compared to " + (targetBody === "Moon" ? "lunar 1.62 m/s\u00B2 (0.165g)" : "Martian 3.72 m/s\u00B2 (0.38g)") + " conditions.",
          engineering_mitigation: "Use active counter-weight offloading gimbals (1/6g or 3/8g) during field mobility/drilling trials and apply Discrete Element Method (DEM) gravity-scaling laws."
        };
      }
      if (pLow.includes("atmosfer") || pLow.includes("bas\u0131n\u00E7") || pLow.includes("vakum") || pLow.includes("pressure")) {
        return {
          ...brk,
          parameter: "Atmospheric Pressure & Gas Composition",
          severity: severityEn,
          target_value: tVal,
          earth_value: eVal,
          impact: "Earth\u2019s dense ~101.3 kPa N\u2082/O\u2082 atmosphere introduces convective heat transfer, aerodynamic drag, and oxidative moisture absent in " + (targetBody === "Moon" ? "lunar hard vacuum (10\u207B\u00B9\u00B2 kPa)" : "Mars\u2019s thin 0.61 kPa (95% CO\u2082) atmosphere") + ".",
          engineering_mitigation: "Follow field traverse campaigns with Dirty Thermal Vacuum (DTVAC) chamber testing to validate radiative-only cooling, outgassing, and CO\u2082/vacuum ISRU reactor kinetics."
        };
      }
      if (pLow.includes("radyasyon") || pLow.includes("kozmik") || pLow.includes("manyeto") || pLow.includes("radiation")) {
        return {
          ...brk,
          parameter: "Ionizing Surface Radiation (GCR & SPE)",
          severity: severityEn,
          target_value: tVal,
          earth_value: eVal,
          impact: "Earth\u2019s magnetosphere and thick atmosphere shield the surface (~2.4 mSv/yr), whereas " + targetBody + " receives unattenuated Galactic Cosmic Rays (GCR) and Solar Particle Events (SPE).",
          engineering_mitigation: "Use the Earth analog site to validate subsurface lava-tube / regolith shielding geometry (LiDAR thickness mapping) while qualifying avionics in proton/heavy-ion beam facilities."
        };
      }
      if (pLow.includes("regolit") || pLow.includes("toz") || pLow.includes("a\u015F\u0131n") || pLow.includes("dust") || pLow.includes("biyo")) {
        return {
          ...brk,
          parameter: "Regolith Micro-Morphology & Electrostatic Dust",
          severity: severityEn,
          target_value: tVal,
          earth_value: eVal,
          impact: "Terrestrial sediments are rounded by aqueous/aeolian weathering and contain trace organics, whereas planetary regolith consists of jagged, unweathered, electrostatically charged silicate/oxide shards.",
          engineering_mitigation: "Conduct rotary joint, seal, and spacesuit abrasion tests inside enclosed dust boxes using certified JSC-1A (Lunar) or MGS-1 (Martian) mineralogical simulants."
        };
      }
      if (pLow.includes("termal") || pLow.includes("s\u0131cakl\u0131k") || pLow.includes("gece") || pLow.includes("thermal")) {
        return {
          ...brk,
          parameter: "Diurnal Thermal Shock & Cryogenic Night",
          severity: severityEn,
          target_value: tVal,
          earth_value: eVal,
          impact: "Earth\u2019s atmosphere moderates diurnal temperature swings to ~15\u201330\u00B0C, whereas " + targetBody + " surfaces undergo extreme cryogenic night drops (-130\u00B0C to -180\u00B0C) and rapid radiative thermal gradients.",
          engineering_mitigation: "Complement field solar/albedo power autonomy trials with liquid-nitrogen (LN\u2082) cryogenic thermal-shock cycling on batteries, seals, and structural joints."
        };
      }
      if (pLow.includes("su") || pLow.includes("buz") || pLow.includes("nem") || pLow.includes("kurak") || pLow.includes("kriyo")) {
        return {
          ...brk,
          parameter: "Moisture Regime & Volatile Stability",
          severity: severityEn,
          target_value: tVal,
          earth_value: eVal,
          impact: "Even hyper-arid terrestrial deserts or polar permafrost retain trace liquid brine films and atmospheric humidity, unlike desiccated vacuum-exposed planetary volatiles.",
          engineering_mitigation: "Pre-bake drill cores and calibrate volatile extraction (ISRU) mass spectrometers under dehydrated purge gas conditions."
        };
      }
      return {
        ...brk,
        parameter: trCriterionName(brk.parameter, "EN"),
        severity: severityEn,
        target_value: tVal,
        earth_value: eVal,
        impact: "Local kilometer-scale environmental and topographic variance between the Earth analog basin and the " + targetBody + " target requires boundary calibration during field testing.",
        engineering_mitigation: "Constrain field validation maneuvers to the high-similarity 1.25\u00D71.25 km Micro-ROI window and apply numerical boundary scaling in mission software."
      };
    }

    function trProcessKey(k, lang) {
      if (!k || lang === "TR") return k || "";
      const low = String(k).toLowerCase();
      if (low.includes("volkan") || low.includes("bazalt") || low.includes("lav")) return "Basaltic Volcanism & Lava Tube Emplacement";
      if (low.includes("eoliyen") || low.includes("r\u00FCzgar") || low.includes("kumul")) return "Aeolian Abrasion & Wind-Driven Dune Dynamics";
      if (low.includes("kriyo") || low.includes("buzul") || low.includes("permafrost")) return "Cryospheric Permafrost & Freeze-Thaw Polygonation";
      if (low.includes("kurak") || low.includes("evaporit") || low.includes("tuz")) return "Hyper-Arid Evaporitic & Salt-Flat Weathering";
      if (low.includes("krater") || low.includes("\u00E7arpma") || low.includes("\u015Fok")) return "Impact Cratering & Shock-Metamorphic Breccia";
      if (low.includes("fl\u00FCvyal") || low.includes("delta") || low.includes("sediman") || low.includes("g\u00F6l")) return "Fluvial-Lacustrine Paleo-Delta Sedimentation";
      if (low.includes("yama\u00E7") || low.includes("k\u00FCtle") || low.includes("erozyon")) return "Gravitational Slope & Escarpment Mass Wasting";
      return trGeneralTokens(k, "EN");
    }

    function buildEnglishMarkdownDossier(data) {
      if (!data || !data.target) return "";
      const t = data.target;
      const cands = data.primary_candidates || [];
      const c1 = cands[0] || {};
      const xaiList = c1.xai_explanation?.breakdown_matrix || data.xai_primary?.breakdown_matrix || [];
      const rmap = data.roadmap || [];
      const lines = [
        "# TERRA-TWIN OFFICIAL MISSION DOSSIER (NASA SPACE APPS 2026)",
        "",
        "## 1. TARGET PLANETARY SITE PROFILE",
        "- **Target Body:** " + t.body,
        "- **Target Designation:** " + t.name,
        "- **Coordinates:** " + t.lat + "\u00B0, " + t.lon + "\u00B0",
        "- **2D DEM Mean Slope / Relief:** " + fmt(t.cross_section?.mean_slope_deg, 2) + "\u00B0 | " + fmt(t.cross_section?.relief_m, 1) + " m",
        "",
        "## 2. TOP 3 DISCOVERED EARTH ANALOG SITES",
        ...cands.map((c, idx) =>
          "### #" + (idx + 1) + " " + c.region_name + "\n" +
          "- **Coordinates:** " + c.lat + "\u00B0, " + c.lon + "\u00B0 (Micro-ROI: " + (c.micro_scale_pinpoint?.micro_lat ?? c.lat) + "\u00B0, " + (c.micro_scale_pinpoint?.micro_lon ?? c.lon) + "\u00B0)\n" +
          "- **Combined Match Score:** " + fmt(c.total_match_pct ?? c.parametric_6d_pct, 1) + "% (6D Pre-Screen Rank #" + c.pre_screen_rank + " -> Final Rank #" + (idx + 1) + ")\n" +
          "- **SRTM 90m DEM Slope & Relief:** " + fmt(c.cross_section?.mean_slope_deg, 2) + "\u00B0 | " + fmt(c.cross_section?.relief_m, 1) + " m\n" +
          "- **NASA POWER Telemetry:** " + fmt(c.nasa_power_climate?.mean_surface_temp_c, 1) + "\u00B0C | " + fmt(c.nasa_power_climate?.precipitation_mm_day, 2) + " mm/day"
        ),
        "",
        "## 3. ANALOG BREAKDOWN LIMITS (XAI) & ENGINEERING MITIGATION",
        ...xaiList.map((b) =>
          "- **" + b.parameter + " [" + b.severity + "]:** Target `" + b.target_value + "` vs Earth `" + b.earth_value + "`.\n" +
          "  - *Physical Impact:* " + b.impact + "\n" +
          "  - *Engineering Mitigation:* " + b.engineering_mitigation
        ),
        "",
        "## 4. PHASED TRL 4 -> 7 FIELD VALIDATION ROADMAP",
        ...rmap.map((r) => "- **" + r.phase + "** (" + r.assigned_sites + "): " + r.objective)
      ];
      return lines.join("\n");
    }

    function localizeApiData(raw, lang) {
      if (!raw || lang === "TR") return raw;
      const data = JSON.parse(JSON.stringify(raw));
      const tBody = data.target?.body || "Moon";
      if (data.target) {
        data.target.name = trTargetName(data.target.name, "EN");
      }
      if (Array.isArray(data.primary_candidates)) {
        data.primary_candidates = data.primary_candidates.map((cand, idx) => {
          cand.strategic_role_badge = idx === 0
            ? "Primary Topographic & Geochemical Twin (#1)"
            : idx === 1
              ? "Secondary Geomorphic & Thermal Analog (#2)"
              : "Tertiary Complementary Field Basin (#3)";
          if (Array.isArray(cand.physical_evidence_table)) {
            cand.physical_evidence_table = cand.physical_evidence_table.map((row) => ({
              ...row,
              criterion: trCriterionName(row.criterion, "EN"),
              earth_measured: trGeneralTokens(row.earth_measured, "EN"),
              target_measured: trGeneralTokens(row.target_measured, "EN"),
              unit: trGeneralTokens(row.unit, "EN"),
              provenance_tier: trGeneralTokens(row.provenance_tier, "EN"),
              source: trGeneralTokens(row.source, "EN")
            }));
          }
          if (cand.process_analogy && cand.process_analogy.process_breakdown) {
            const nextBreak = {};
            Object.entries(cand.process_analogy.process_breakdown).forEach(([k, v]) => {
              nextBreak[trProcessKey(k, "EN")] = v;
            });
            cand.process_analogy.process_breakdown = nextBreak;
          }
          if (cand.astrobiology_profile) {
            const gLow = String(cand.astrobiology_profile.extremophile_guild || "").toLowerCase();
            if (gLow.includes("kriyo") || gLow.includes("buz") || gLow.includes("kut") || cand.lat > 55 || cand.lat < -55) {
              cand.astrobiology_profile.extremophile_guild = "Cryophilic Permafrost, Psychrophilic & Sub-Zero Brine Lithotrophs";
            } else {
              cand.astrobiology_profile.extremophile_guild = "Endolithic, Hyper-Arid Halophilic & UV/Radiation-Tolerant Extremophiles";
            }
            cand.astrobiology_profile.astrobiology_mission_relevance =
              "With a mean surface temperature of " + fmt(cand.nasa_power_climate?.mean_surface_temp_c, 1) +
              "\u00B0C, hyper-arid precipitation of " + fmt(cand.nasa_power_climate?.precipitation_mm_day, 2) +
              " mm/day, and solar flux of " + fmt(cand.astrobiology_profile.solar_irradiance_kwh_m2_day, 2) +
              " kWh/m\u00B2/day, this basin serves as a high-fidelity testbed for subsurface biosignature preservation, Raman/LIBS life-detection spectrometers, and planetary protection sterilization protocols.";
          }
          if (cand.xai_explanation && Array.isArray(cand.xai_explanation.breakdown_matrix)) {
            cand.xai_explanation.breakdown_matrix = cand.xai_explanation.breakdown_matrix.map((b) =>
              trXaiBreakdownItem(b, tBody, "EN")
            );
          }
          return cand;
        });
      }
      if (data.xai_primary && Array.isArray(data.xai_primary.breakdown_matrix)) {
        data.xai_primary.breakdown_matrix = data.xai_primary.breakdown_matrix.map((b) =>
          trXaiBreakdownItem(b, tBody, "EN")
        );
      }
      if (data.complementary_split_site) {
        data.complementary_split_site.weakest_dimension_name = trCriterionName(
          data.complementary_split_site.weakest_dimension_name,
          "EN"
        );
      }
      if (Array.isArray(data.roadmap)) {
        const c0 = data.primary_candidates?.[0]?.region_name?.split("[")[0]?.trim() || "Primary Analog Basin";
        const c1 = data.primary_candidates?.[1]?.region_name?.split("[")[0]?.trim() || c0;
        const compName = data.complementary_split_site?.complementary_region_name?.split("[")[0]?.trim() || c1;
        data.roadmap = [
          {
            phase: "Phase 1 (TRL 4 -> 5): Sensor, Spectrometer & Geochemical Calibration",
            assigned_sites: c0,
            objective: "Calibrate Raman/LIBS mineralogy spectrometers, ground-penetrating radar (GPR), and optical navigation filters on bare basaltic/evaporitic outcrops."
          },
          {
            phase: "Phase 2 (TRL 5 -> 6): Rover Traverse, Excavation & Subsurface Habitat Trials",
            assigned_sites: c0 + " + " + compName,
            objective: "Execute autonomous multi-kilometer rover path-planning inside the 1.25x1.25 km low-slope Micro-ROI window and test ISRU drilling / habitat deployment."
          },
          {
            phase: "Phase 3 (TRL 6 -> 7): Integrated Human-Robotic EVA & DTVAC Qualification",
            assigned_sites: c0 + " & Environmental Chamber",
            objective: "Perform full-dress astronaut EVA communication latency simulations followed by Dirty Thermal Vacuum (DTVAC) and 1/6g-3/8g gravity-offloading verification."
          }
        ];
      }
      data.markdown_dossier = buildEnglishMarkdownDossier(data);
      return data;
    }

    function geographicPosition(lat, lon, radius = 2) {
      const phi = THREE.MathUtils.degToRad(90 - lat);
      const theta = THREE.MathUtils.degToRad(lon + 180);
      return new THREE.Vector3(
        -radius * Math.sin(phi) * Math.cos(theta),
        radius * Math.cos(phi),
        radius * Math.sin(phi) * Math.sin(theta)
      );
    }

    function vectorToGeographic(point) {
      const r = point.length() || 1;
      const sinLat = Math.max(-1, Math.min(1, point.y / r));
      const lat = THREE.MathUtils.radToDeg(Math.asin(sinLat));
      const thetaDeg = (THREE.MathUtils.radToDeg(Math.atan2(point.z, -point.x)) + 360) % 360;
      const lon = thetaDeg - 180;
      return { lat: Math.round(lat * 100) / 100, lon: Math.round(lon * 100) / 100 };
    }

    function triggerDownload(content, mime, filename) {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function PlanetViewport({ body, centerLat, centerLon, imagery, grid, markers, customMarkers, splitBridgeCoords, selectedId, onSelect, onGlobeClick, lang }) {
      const hostRef = useRef(null);
      const apiRef = useRef(null);
      const sceneObjsRef = useRef(null);
      const [hoverCoords, setHoverCoords] = useState(null);
      const latest = useRef({ imagery, grid, markers, selectedId, onSelect, onGlobeClick });
      latest.current = { imagery, grid, markers, selectedId, onSelect, onGlobeClick };

      useEffect(() => {
        const container = hostRef.current;
        if (!container) return;
        let renderer;
        try {
          renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
        } catch (err) { return; }
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.0));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(38, 1, 0.01, 100);
        const initPos = geographicPosition(centerLat || 15, centerLon || 20, 5.8);
        camera.position.copy(initPos);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 2.15;
        controls.maxDistance = 12;

        scene.add(new THREE.AmbientLight(0xcbd5e1, 2.15));
        const starGeo = new THREE.BufferGeometry();
        const starPos = [];
        for (let i = 0; i < 500; i++) {
          const v = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize().multiplyScalar(15 + Math.random() * 25);
          starPos.push(v.x, v.y, v.z);
        }
        starGeo.setAttribute("position", new THREE.Float32BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.04, sizeAttenuation: true, transparent: true, opacity: 0.85 });
        scene.add(new THREE.Points(starGeo, starMat));

        const sun = new THREE.DirectionalLight(0xffffff, 2.8);
        sun.position.set(-4, 6, 8);
        scene.add(sun);

        const geo = new THREE.SphereGeometry(2, 96, 64);
        const mat = new THREE.MeshStandardMaterial({ color: body === "Mars" ? 0xbb795b : 0xffffff, roughness: 0.95 });
        const globe = new THREE.Mesh(geo, mat);
        scene.add(globe);

        let disposed = false;
        let loadedTex = null;
        const texUrl = body === "Earth" ? "/textures/earth-gibs.jpg" : "/textures/" + body.toLowerCase() + ".jpg";
        new THREE.TextureLoader().load(texUrl, (t) => {
          if (disposed) { t.dispose(); return; }
          loadedTex = t;
          t.colorSpace = THREE.SRGBColorSpace;
          t.anisotropy = Math.min(16, renderer.capabilities.getMaxAnisotropy());
          t.minFilter = THREE.LinearMipmapLinearFilter;
          t.magFilter = THREE.LinearFilter;
          t.generateMipmaps = true;
          mat.map = latest.current.imagery ? t : null;
          mat.color.set(0xffffff);
          mat.needsUpdate = true;
        });

        const lines = new THREE.Group();
        const gridMat = new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.14, depthWrite: false });
        for (let lat = -60; lat <= 60; lat += 30) {
          const p = [];
          for (let lon = -180; lon <= 180; lon += 3) p.push(geographicPosition(lat, lon, 2.006));
          lines.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(p), gridMat));
        }
        for (let lon = 0; lon < 360; lon += 30) {
          const p = [];
          for (let lat = -90; lat <= 90; lat += 3) p.push(geographicPosition(lat, lon, 2.006));
          lines.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(p), gridMat));
        }
        scene.add(lines);

        const markerGroup = new THREE.Group();
        scene.add(markerGroup);
        sceneObjsRef.current = { container, camera, controls, markerGroup, markerMeshes: [], labelElements: [] };

        apiRef.current = {
          focus: (la, lo) => {
            const tLa = la !== undefined ? la : (centerLat || 15);
            const tLo = lo !== undefined ? lo : (centerLon || 20);
            camera.position.copy(geographicPosition(tLa, tLo, 4.9));
            controls.target.set(0, 0, 0);
            controls.update();
          },
          zoom: (f) => { camera.position.multiplyScalar(f).clampLength(2.15, 12); controls.update(); },
          reset: () => { camera.position.copy(initPos); controls.target.set(0, 0, 0); controls.update(); }
        };

        const ro = new ResizeObserver(() => {
          const w = container.clientWidth, h = container.clientHeight;
          renderer.setSize(w, h);
          camera.aspect = w / Math.max(h, 1);
          camera.updateProjectionMatrix();
        });
        ro.observe(container);

        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let sx = 0, sy = 0, downTime = 0;
        const onDown = (e) => { sx = e.clientX; sy = e.clientY; downTime = Date.now(); };
        const onMove = (e) => {
          const b = renderer.domElement.getBoundingClientRect();
          pointer.set(((e.clientX - b.left) / b.width) * 2 - 1, (-(e.clientY - b.top) / b.height) * 2 + 1);
          raycaster.setFromCamera(pointer, camera);
          const hit = raycaster.intersectObject(globe)[0];
          setHoverCoords(hit ? vectorToGeographic(hit.point) : null);
        };
        const onUp = (e) => {
          const dist = Math.hypot(e.clientX - sx, e.clientY - sy);
          const elapsed = Date.now() - downTime;
          if (dist > 14 && elapsed > 350) return;
          const b = renderer.domElement.getBoundingClientRect();
          pointer.set(((e.clientX - b.left) / b.width) * 2 - 1, (-(e.clientY - b.top) / b.height) * 2 + 1);
          raycaster.setFromCamera(pointer, camera);
          const meshes = sceneObjsRef.current ? sceneObjsRef.current.markerMeshes : [];
          const hitM = raycaster.intersectObjects(meshes)[0];
          if (hitM && latest.current.onSelect) { latest.current.onSelect(hitM.object.userData.id); return; }
          const hitG = raycaster.intersectObject(globe)[0];
          if (hitG && latest.current.onGlobeClick) {
            const c = vectorToGeographic(hitG.point);
            latest.current.onGlobeClick(body, c.lat, c.lon);
          }
        };

        renderer.domElement.addEventListener("pointerdown", onDown);
        renderer.domElement.addEventListener("pointermove", onMove);
        renderer.domElement.addEventListener("pointerup", onUp);

        let frameId = 0;
        const animate = () => {
          if (disposed) return;
          if (document.hidden) { frameId = requestAnimationFrame(animate); return; }
          controls.update();
          lines.visible = latest.current.grid;
          markerGroup.visible = latest.current.markers;
          if (mat.map !== (latest.current.imagery ? loadedTex : null)) {
            mat.map = latest.current.imagery ? loadedTex : null;
            mat.needsUpdate = true;
          }
          const camDist = camera.position.length();
          const altitude = Math.max(0.01, camDist - 2.0);
          controls.rotateSpeed = Math.max(0.18, Math.min(0.85, altitude / 2.6));
          const pinScale = Math.max(0.18, Math.min(1.15, Math.pow(altitude / 2.6, 0.82)));
          const pinOpacity = Math.max(0.02, Math.min(0.95, (altitude - 0.05) / 1.65));
          markerGroup.children.forEach((obj) => {
            if (obj.isMesh) {
              obj.scale.setScalar(pinScale);
              if (obj.material) {
                obj.material.transparent = true;
                obj.material.opacity = obj.userData.isRing ? pinOpacity * 0.82 : pinOpacity;
              }
            }
          });
          const camDir = camera.position.clone().normalize();
          const lbls = sceneObjsRef.current ? sceneObjsRef.current.labelElements : [];
          lbls.forEach(({ el, pos, id }) => {
            const vis = latest.current.markers && pos.clone().normalize().dot(camDir) > 0.20;
            el.style.display = vis ? "block" : "none";
            if (vis) {
              const p = pos.clone().project(camera);
              el.style.left = ((p.x * 0.5 + 0.5) * container.clientWidth) + "px";
              el.style.top = ((-p.y * 0.5 + 0.5) * container.clientHeight) + "px";
              const textScale = Math.max(0.68, Math.min(1.0, 0.64 + altitude * 0.14));
              const textOpacity = Math.max(0.05, Math.min(1.0, (altitude - 0.02) / 1.4));
              el.style.opacity = String(textOpacity);
              el.style.transform = "translate(10px, -50%) scale(" + textScale.toFixed(2) + ")";
              el.classList.toggle("selected", id === latest.current.selectedId);
            }
          });
          renderer.render(scene, camera);
          frameId = requestAnimationFrame(animate);
        };
        animate();

        return () => {
          disposed = true;
          cancelAnimationFrame(frameId);
          ro.disconnect();
          controls.dispose();
          if (sceneObjsRef.current) sceneObjsRef.current.labelElements.forEach((x) => x.el.remove());
          renderer.dispose();
          renderer.domElement.remove();
        };
      }, [body]);

      useEffect(() => {
        const ctx = sceneObjsRef.current;
        if (!ctx) return;
        const { container, markerGroup } = ctx;
        while (markerGroup.children.length > 0) markerGroup.remove(markerGroup.children[0]);
        ctx.labelElements.forEach((x) => x.el.remove());
        ctx.markerMeshes = [];
        ctx.labelElements = [];

        const markerGeo = new THREE.SphereGeometry(0.036, 14, 14);
        const ringGeo = new THREE.RingGeometry(0.055, 0.076, 36);

        (customMarkers || []).forEach((item) => {
          const col = item.colorHex || 0x38bdf8;
          const mMat = new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.95, depthWrite: false });
          const rMat = new THREE.MeshBasicMaterial({ color: col, side: THREE.DoubleSide, transparent: true, opacity: 0.92 });
          const pos = geographicPosition(item.lat, item.lon, 2.028);
          const mesh = new THREE.Mesh(markerGeo, mMat);
          mesh.position.copy(pos);
          mesh.userData.id = item.id;
          markerGroup.add(mesh);
          ctx.markerMeshes.push(mesh);

          const ring = new THREE.Mesh(ringGeo, rMat);
          ring.position.copy(pos.clone().multiplyScalar(1.002));
          ring.lookAt(pos.clone().multiplyScalar(2));
          ring.userData.isRing = true;
          markerGroup.add(ring);

          const el = document.createElement("button");
          el.className = "globe-label";
          el.textContent = item.badge ? item.badge + " " + item.name : item.name;
          el.onclick = (ev) => { ev.stopPropagation(); latest.current.onSelect && latest.current.onSelect(item.id); };
          container.appendChild(el);
          ctx.labelElements.push({ el, pos, id: item.id });
        });
      }, [body, customMarkers, splitBridgeCoords]);

      useEffect(() => {
        if (centerLat !== undefined && centerLon !== undefined && apiRef.current) {
          apiRef.current.focus(centerLat, centerLon);
        }
      }, [centerLat, centerLon]);

      return h("div", { className: "planet-viewport" },
        h("div", { className: "planet-canvas", ref: hostRef }),
        h("div", { className: "viewport-caption" },
          h("span", { className: "status-dot" }),
          body === "Earth"
            ? (lang === "TR" ? "3B D\u00DCNYA ANALOG K\u00DCRES\u0130 (11.469 H\u00DCCRE)" : "3D EARTH ANALOG GLOBE (11,469 CELLS)")
            : "3D " + body.toUpperCase() + (lang === "TR" ? " Y\u00DCZEY K\u00DCRES\u0130 (TIKLA & SE\u00C7)" : " SURFACE GLOBE (CLICK TO SELECT)"),
          hoverCoords && h("span", { style: { marginLeft: 10, color: "#38bdf8", fontWeight: 600 } },
            "\uD83C\uDFAF " + hoverCoords.lat + "\u00B0, " + hoverCoords.lon + "\u00B0"
          ),
          h("span", { className: "view-mode" }, "3D INTERACTIVE")
        ),
        h("div", { className: "viewport-tools" },
          h("button", { title: "Focus", onClick: () => apiRef.current?.focus(centerLat, centerLon) }, "\u2316"),
          h("button", { title: "Zoom In", onClick: () => apiRef.current?.zoom(0.8) }, "+"),
          h("button", { title: "Zoom Out", onClick: () => apiRef.current?.zoom(1.2) }, "\u2212"),
          h("button", { title: "Reset", onClick: () => apiRef.current?.reset() }, "\u21BA")
        ),
        h("div", { className: "viewport-bottom" },
          h("span", null, body === "Earth" ? "NASA GIBS \u00B7 SRTM 90m DEM + NASA POWER" : "NASA LRO LOLA / MGS MOLA + WMTS"),
          h("span", { style: { color: "#38bdf8" } }, lang === "TR" ? "Y\u00FCzeye t\u0131klayarak koordinat se\u00E7ebilirsiniz" : "Click anywhere on the globe to analyze coordinates")
        )
      );
    }

    function RadarChart6D({ targetName, targetVec, candidates, compSite, lang }) {
      const size = 310, cx = 155, cy = 155, radius = 100;
      const labels = lang === "TR"
        ? ["1. Bazalt/Albedo", "2. D\u00FCzl\u00FCk (<5\u00B0)", "3. Termal/G\u00FCne\u015F", "4. Su Buzu (ISRU)", "5. Kurakl\u0131k", "6. R\u00F6lyef/Ma\u011Fara"]
        : ["1. Basalt/Albedo", "2. Flatness (<5\u00B0)", "3. Thermal/Solar", "4. Water Ice", "5. Aridity", "6. Relief/Caves"];
      const pt = (i, v) => {
        const a = (Math.PI * 2 * i) / 6 - Math.PI / 2;
        const r = Math.max(0, Math.min(1, Number(v) || 0)) * radius;
        return (cx + r * Math.cos(a)).toFixed(1) + "," + (cy + r * Math.sin(a)).toFixed(1);
      };
      const poly = (arr) => (arr || [0.5,0.5,0.5,0.5,0.5,0.5]).map((v, i) => pt(i, v)).join(" ");

      return h("div", null,
        h("svg", { viewBox: "0 0 " + size + " " + size, style: { width: "100%", maxHeight: 280 } },
          [0.25, 0.5, 0.75, 1.0].map((lvl) =>
            h("polygon", { key: lvl, points: [0,1,2,3,4,5].map((i) => pt(i, lvl)).join(" "), fill: "none", stroke: "#1e293b" })
          ),
          [0,1,2,3,4,5].map((i) => {
            const a = (Math.PI * 2 * i) / 6 - Math.PI / 2;
            return h("g", { key: i },
              h("line", { x1: cx, y1: cy, x2: cx + radius * Math.cos(a), y2: cy + radius * Math.sin(a), stroke: "#334155" }),
              h("text", { x: cx + (radius + 28) * Math.cos(a), y: cy + (radius + 18) * Math.sin(a), fill: "#cbd5e1", fontSize: "9.5", textAnchor: "middle" }, labels[i])
            );
          }),
          h("polygon", { points: poly(targetVec), fill: "rgba(56, 189, 248, 0.22)", stroke: "#38bdf8", strokeWidth: 2.4 }),
          candidates[0] && h("polygon", { points: poly(candidates[0].features_6d), fill: "rgba(245, 158, 11, 0.18)", stroke: "#f59e0b", strokeWidth: 2.2 }),
          compSite?.features_6d && h("polygon", { points: poly(compSite.features_6d), fill: "none", stroke: "#818cf8", strokeWidth: 1.8, strokeDasharray: "4 3" })
        ),
        h("div", { style: { display: "flex", gap: 12, justifyContent: "center", fontSize: 11, flexWrap: "wrap" } },
          h("span", { style: { color: "#38bdf8" } }, "\u25CF " + (targetName || "").slice(0, 28)),
          candidates[0] && h("span", { style: { color: "#f59e0b" } }, "\u25CF #1: " + candidates[0].region_name.split("[")[0].trim()),
          compSite && h("span", { style: { color: "#818cf8" } }, "\u2508 Split-Site: " + compSite.complementary_region_name.split("[")[0].trim())
        )
      );
    }

    function CrossSectionChart2D({ target, cand, lang }) {
      const tCs = target?.cross_section;
      const eCs = cand?.cross_section;
      if (!tCs || !eCs) return null;
      const w = 450, hSvg = 240, padL = 42, padR = 16, padT = 24, padB = 34;
      const plotW = w - padL - padR, plotH = hSvg - padT - padB;
      const tElev = tCs.elevation_m || [], eElev = eCs.elevation_m || [], dists = eCs.distances_km || [];
      const maxElev = Math.max(10, ...tElev, ...eElev);
      const maxDist = Math.max(1, ...(dists.length ? dists : [10]));
      const makePath = (arr) => arr.length > 1 ? arr.map((v, i) => (i === 0 ? "M" : "L") + (padL + (i / Math.max(1, arr.length - 1)) * plotW).toFixed(1) + "," + (padT + plotH - (v / maxElev) * plotH).toFixed(1)).join(" ") : "";
      const bestKm = Number(eCs.best_base_km ?? maxDist / 2);
      const bestIdx = eElev.length ? Math.min(eElev.length - 1, Math.max(0, Math.round((bestKm / maxDist) * (eElev.length - 1)))) : 0;
      const bestX = padL + (bestIdx / Math.max(1, eElev.length - 1)) * plotW;
      const bestY = padT + plotH - ((eElev[bestIdx] || 0) / maxElev) * plotH;

      return h("div", null,
        h("svg", { viewBox: "0 0 " + w + " " + hSvg, style: { width: "100%", maxHeight: 270 } },
          [0, 0.25, 0.5, 0.75, 1].map((f) => {
            const y = padT + plotH - f * plotH;
            return h("g", { key: f },
              h("line", { x1: padL, y1: y, x2: w - padR, y2: y, stroke: "#1e293b" }),
              h("text", { x: padL - 6, y: y + 3, fill: "#94a3b8", fontSize: "9", textAnchor: "end" }, Math.round(f * maxElev) + "m")
            );
          }),
          tElev.length > 1 && h("path", { d: makePath(tElev), fill: "none", stroke: "#38bdf8", strokeWidth: 2.2 }),
          eElev.length > 1 && h("path", { d: makePath(eElev), fill: "none", stroke: "#f59e0b", strokeWidth: 2.2 }),
          eElev.length > 1 && h("circle", { cx: bestX, cy: bestY, r: 5.5, fill: "#10b981", stroke: "#fff", strokeWidth: 1.5 }),
          eElev.length > 1 && h("text", { x: bestX, y: Math.max(14, bestY - 8), fill: "#34d399", fontSize: "9.5", textAnchor: "middle" }, "\u2605 " + (lang === "TR" ? "D\u00DC\u015E\u00DCK E\u011E\u0130M PENCERES\u0130 (" : "LOW-SLOPE WINDOW (") + bestKm + " km)"),
          h("text", { x: w / 2, y: hSvg - 6, fill: "#94a3b8", fontSize: "9.5", textAnchor: "middle" }, (lang === "TR" ? "Taktik Kesit Mesafesi (0 \u2014 " : "Transect Distance (0 \u2014 ") + maxDist.toFixed(0) + " km) \u00B7 " + (eCs.dem_source || "").slice(0, 42))
        ),
        h("div", { style: { display: "flex", gap: 14, justifyContent: "center", fontSize: 11, flexWrap: "wrap" } },
          h("span", { style: { color: "#38bdf8" } }, "\u2501 " + target.body + " (" + fmt(tCs.mean_slope_deg, 2) + "\u00B0 | " + fmt(tCs.relief_m, 1) + " m)"),
          h("span", { style: { color: "#f59e0b" } }, "\u2501 Earth SRTM 90m DEM (" + fmt(eCs.mean_slope_deg, 2) + "\u00B0 | " + fmt(eCs.relief_m, 1) + " m)")
        )
      );
    }

    function App() {

      // AKTIF DILE GORE TUM API VERISINI ANINDA CEVIREN MEMO
      const apiData = useMemo(() => localizeApiData(rawApiData, lang), [rawApiData, lang]);

      function selectTabAndScroll(tabId) {

      useEffect(() => {

      async function runAnalysis(overrides = {}) {
        setLoading(true);
        const effMode = overrides.selection_mode ?? selectionMode;
        const effPreset = overrides.preset_id ?? presetId;
        const effBody = overrides.body ?? (effMode === "PRESET" ? (PRESET_CATALOG.find((p) => p.id === effPreset)?.body || "Moon") : dynBody);
        const payload = {
          selection_mode: effMode,
          preset_id: effPreset,
          body: effBody,
          lat: overrides.lat ?? dynLat,
          lon: overrides.lon ?? dynLon,
          radius_km: overrides.radius_km ?? radiusKm,
          mission_mode: overrides.mission_mode ?? missionMode,
          custom_weights: overrides.custom_weights ?? customWeights,
          novelty_only: overrides.novelty_only ?? noveltyOnly,
          min_separation_km: overrides.min_separation_km ?? minSepKm
        };
        try {
          const r = await fetch("/api/analyze", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          const d = await r.json();
          if (d && d.status === "ok") {
            setRawApiData(d);
            setSelectedCandIdx(0);
          }
        } catch (e) {
          console.error(e);
        } finally {
          setLoading(false);
        }
      }

      useEffect(() => {
        runAnalysis();
      }, [selectionMode, presetId, dynBody, dynLat, dynLon, radiusKm, missionMode, noveltyOnly, minSepKm]);

      const targetProfile = apiData?.target;
      const candidates = apiData?.primary_candidates || [];

                  h("p", { style: { marginBottom: 10 } }, tr("1. Stage 1 (Global 11,469 Bare-Earth Cell Screening): Oceans and dense vegetation are masked from NASA GIBS layers. Haversine Non-Maximum Suppression (NMS) selects 8 independent geological basins.", "1. Kademe 1 (11.469 K\u00FCresel Kara H\u00FCcresi Taramas\u0131): NASA GIBS katmanlar\u0131ndan okyanuslar ve bitki \u00F6rt\u00FCs\u00FC elenerek 11.469 \u00E7\u0131plak kaya, hiper-kurak ve kriyosferik h\u00FCcre indekslenir. Haversine NMS ile birbirinden ba\u011F\u0131ms\u0131z en iyi 8 jeolojik havza se\u00E7ilir.")),
                  h("p", null, tr("2. Stage 2 (SRTM 90m DEM & NASA POWER Re-Ranking): Top 8 basins are evaluated with orthometric elevation profiles (Copernicus GLO-90 / NASA SRTM 90m DEM), NASA Langley POWER meteorology, and LRO LOLA / MGS MOLA records.", "2. Kademe 2 (SRTM 90m DEM & NASA POWER Kar\u015F\u0131la\u015Ft\u0131rmas\u0131): 8 aday havza i\u00E7in Copernicus GLO-90 / NASA SRTM 90m DEM servisinden ger\u00E7ek metrik kesit, NASA Langley POWER uydusundan iklim verileri ve LRO LOLA / MGS MOLA kay\u0131tlar\u0131 kar\u015F\u0131la\u015Ft\u0131r\u0131l\u0131r."))
