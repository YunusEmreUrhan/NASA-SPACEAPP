<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TERRA-TWIN | NASA 2026 3D Planetary Analog Lab</title>
  <link rel="stylesheet" href="/styles.css" />
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "three": "https://esm.sh/three@0.170.0",
      "three/addons/": "https://esm.sh/three@0.170.0/examples/jsm/"
    }
  }

</head>
<body>
  <div id="root">
    <div style="padding:40px;text-align:center;color:#8ce9d0;font-family:monospace;">
      TERRA-TWIN 3B Gezegen Motoru Baslatiliyor...
    </div>
  </div>
  <script type="module">
    import React, { useState, useEffect, useRef, useMemo } from "react";
    import { createRoot } from "react-dom/client";
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const h = React.createElement;

    const PRESET_CATALOG = [
      { id: "MOON_MARE_TRANQUILLITATIS_PIT", body: "Moon", name: "Mare Tranquillitatis Pit (Lava Tube Skylight)", lat: 8.335, lon: 33.222 },
      { id: "MOON_SHACKLETON_RIM", body: "Moon", name: "Shackleton Crater Rim (Lunar South Pole)", lat: -89.9, lon: 0.0 },
      { id: "MOON_MARIUS_HILLS", body: "Moon", name: "Marius Hills Volcanic Dome & Rille", lat: 14.09, lon: -56.77 },
      { id: "MARS_JEZERO_CRATER", body: "Mars", name: "Jezero Crater Paleo-Lake Delta (Mars 2020)", lat: 18.38, lon: 77.58 },
      { id: "MARS_ARCADIA_PLANITIA", body: "Mars", name: "Arcadia Planitia Shallow Ice Sheet", lat: 39.2, lon: -188.0 },
      { id: "MARS_ARSIA_MONS_CAVES", body: "Mars", name: "Arsia Mons Seven Sisters Skylight Pits", lat: -7.22, lon: -120.45 }
    ];

    const MISSION_MODES = [
      { id: "HABITAT_LAVA_TUBE", label: "\uD83C\uDFF0 Yeralt\u0131 Bo\u015Fluk / Lav T\u00FCp\u00FC \u00D6n Taramas\u0131" },
      { id: "ISRU_WATER_MINING", label: "\uD83E\uDDCA Kriyosferik Su Buzu (ISRU) \u00D6n Taramas\u0131" },
      { id: "ROVER_LANDING_OPS", label: "\uD83D\uDE9C D\u00FC\u015F\u00FCk E\u011Fim (<5\u00B0) & Rover Trafik \u00D6n Taramas\u0131" },
      { id: "BALANCED", label: "\u2696\uFE0F Dengeli \u00C7ok Boyutlu \u00D6n Tarama (Balanced)" },
      { id: "CUSTOM", label: "\uD83C\uDF9B\uFE0F Manuel Senaryo A\u011F\u0131rl\u0131klar\u0131 (6B Duyarl\u0131l\u0131k)" }
    ];

    const QUICK_COORDS = [
      { label: "\uD83C\uDF0B Valles Marineris", body: "Mars", lat: -13.8, lon: -61.2 },
      { label: "\u2744\uFE0F Korolev Buzulu", body: "Mars", lat: 72.8, lon: 164.5 },
      { label: "\u26F0\uFE0F Olympus Mons", body: "Mars", lat: 18.65, lon: -133.8 },
      { label: "\uD83C\uDF11 Syrtis Major", body: "Mars", lat: 8.4, lon: 69.5 },
      { label: "\uD83C\uDF15 Tycho Krateri (Ay)", body: "Moon", lat: -43.31, lon: -11.36 }
    ];

    function statusBadgeClass(lbl) {
      if (!lbl) return "status-pill status-sim";
      const s = String(lbl);
      if (s.indexOf("NASA") !== -1) return "status-pill status-nasa";
      if (s.indexOf("veri yok") !== -1) return "status-pill status-miss";
      return "status-pill status-sim";
    }

    function geographicPosition(lat, lon, radius = 2) {
      const phi = THREE.MathUtils.degToRad(90 - lat);
      const theta = THREE.MathUtils.degToRad(lon + 180);
      return new THREE.Vector3(
        -radius * Math.sin(phi) * Math.cos(theta),
        radius * Math.cos(phi),
        radius * Math.sin(phi) * Math.sin(theta)
      );
    }

    function vectorToGeographic(point) {
      const r = point.length() || 1;
      const sinLat = Math.max(-1, Math.min(1, point.y / r));
      const lat = THREE.MathUtils.radToDeg(Math.asin(sinLat));
      const thetaDeg = (THREE.MathUtils.radToDeg(Math.atan2(point.z, -point.x)) + 360) % 360;
      const lon = thetaDeg - 180;
      return { lat: Math.round(lat * 100) / 100, lon: Math.round(lon * 100) / 100 };
    }

    function triggerDownload(content, mime, filename) {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function PlanetViewport({ body, centerLat, centerLon, imagery, grid, markers, customMarkers, splitBridgeCoords, selectedId, onSelect, onGlobeClick }) {
      const hostRef = useRef(null);
      const apiRef = useRef(null);
      const [hoverCoords, setHoverCoords] = useState(null);
      const latest = useRef({ imagery, grid, markers, selectedId, onSelect, onGlobeClick });
      latest.current = { imagery, grid, markers, selectedId, onSelect, onGlobeClick };

      useEffect(() => {
        const container = hostRef.current;
        if (!container) return;
        let renderer;
        try {
          renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
        } catch (err) { return; }
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
        const initPos = geographicPosition(centerLat || 20, centerLon || 10, 5.8);
        camera.position.copy(initPos);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 2.6;
        controls.maxDistance = 12;

        scene.add(new THREE.AmbientLight(0xb5c8de, 2.0));
        const sun = new THREE.DirectionalLight(0xffffff, 2.8);
        sun.position.set(-4, 6, 8);
        scene.add(sun);

        const geo = new THREE.SphereGeometry(2, 96, 64);
        const mat = new THREE.MeshStandardMaterial({ color: body === "Mars" ? 0xbb795b : 0xffffff, roughness: 0.95 });
        const globe = new THREE.Mesh(geo, mat);
        scene.add(globe);

        let disposed = false;
        let loadedTex = null;
        const texUrl = body === "Earth" ? "/textures/earth-gibs.jpg" : "/textures/" + body.toLowerCase() + ".jpg";
        new THREE.TextureLoader().load(texUrl, (t) => {
          if (disposed) { t.dispose(); return; }
          loadedTex = t;
          t.colorSpace = THREE.SRGBColorSpace;
          t.anisotropy = renderer.capabilities.getMaxAnisotropy();
          mat.map = latest.current.imagery ? t : null;
          mat.color.set(0xffffff);
          mat.needsUpdate = true;
        });

        const lines = new THREE.Group();
        const gridMat = new THREE.LineBasicMaterial({ color: 0x8ac6d9, transparent: true, opacity: 0.16, depthWrite: false });
        for (let lat = -60; lat <= 60; lat += 30) {
          const p = [];
          for (let lon = -180; lon <= 180; lon += 3) p.push(geographicPosition(lat, lon, 2.006));
          lines.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(p), gridMat));
        }
        for (let lon = 0; lon < 360; lon += 30) {
          const p = [];
          for (let lat = -90; lat <= 90; lat += 3) p.push(geographicPosition(lat, lon, 2.006));
          lines.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(p), gridMat));
        }
        scene.add(lines);

        const markerGroup = new THREE.Group();
        scene.add(markerGroup);
        const markerMeshes = [];
        const labelElements = [];
        const markerGeo = new THREE.SphereGeometry(0.032, 14, 14);
        const ringGeo = new THREE.RingGeometry(0.05, 0.068, 36);

        (customMarkers || []).forEach((item) => {
          const col = item.colorHex || 0x72f2ca;
          const mMat = new THREE.MeshBasicMaterial({ color: col });
          const rMat = new THREE.MeshBasicMaterial({ color: col, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });
          const pos = geographicPosition(item.lat, item.lon, 2.026);
          const mesh = new THREE.Mesh(markerGeo, mMat);
          mesh.position.copy(pos);
          mesh.userData.id = item.id;
          markerGroup.add(mesh);
          markerMeshes.push(mesh);

          const ring = new THREE.Mesh(ringGeo, rMat);
          ring.position.copy(pos.clone().multiplyScalar(1.002));
          ring.lookAt(pos.clone().multiplyScalar(2));
          markerGroup.add(ring);

          const el = document.createElement("button");
          el.className = "globe-label";
          el.textContent = item.badge ? item.badge + " " + item.name : item.name;
          el.onclick = (ev) => { ev.stopPropagation(); latest.current.onSelect && latest.current.onSelect(item.id); };
          container.appendChild(el);
          labelElements.push({ el, pos, id: item.id });
        });

        if (body === "Earth" && splitBridgeCoords) {
          const pStart = geographicPosition(splitBridgeCoords.fromLat, splitBridgeCoords.fromLon, 2.02);
          const pEnd = geographicPosition(splitBridgeCoords.toLat, splitBridgeCoords.toLon, 2.02);
          const arcPts = [];
          for (let i = 0; i <= 48; i++) {
            const t = i / 48;
            const interp = new THREE.Vector3().lerpVectors(pStart, pEnd, t).normalize();
            arcPts.push(interp.multiplyScalar(2.02 + Math.sin(t * Math.PI) * 0.14));
          }
          markerGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(arcPts), new THREE.LineBasicMaterial({ color: 0x00f5d4 })));
        }

        apiRef.current = {
          focus: () => { camera.position.copy(geographicPosition(centerLat || 20, centerLon || 10, 4.8)); controls.update(); },
          zoom: (f) => { camera.position.multiplyScalar(f).clampLength(2.7, 12); controls.update(); },
          reset: () => { camera.position.copy(initPos); controls.update(); }
        };

        const ro = new ResizeObserver(() => {
          const w = container.clientWidth, h = container.clientHeight;
          renderer.setSize(w, h);
          camera.aspect = w / Math.max(h, 1);
          camera.updateProjectionMatrix();
        });
        ro.observe(container);

        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let sx = 0, sy = 0;
        const onDown = (e) => { sx = e.clientX; sy = e.clientY; };
        const onMove = (e) => {
          const b = renderer.domElement.getBoundingClientRect();
          pointer.set(((e.clientX - b.left) / b.width) * 2 - 1, (-(e.clientY - b.top) / b.height) * 2 + 1);
          raycaster.setFromCamera(pointer, camera);
          const hit = raycaster.intersectObject(globe)[0];
          setHoverCoords(hit ? vectorToGeographic(hit.point) : null);
        };
        const onUp = (e) => {
          if (Math.hypot(e.clientX - sx, e.clientY - sy) > 5) return;
          const b = renderer.domElement.getBoundingClientRect();
          pointer.set(((e.clientX - b.left) / b.width) * 2 - 1, (-(e.clientY - b.top) / b.height) * 2 + 1);
          raycaster.setFromCamera(pointer, camera);
          const hitM = raycaster.intersectObjects(markerMeshes)[0];
          if (hitM && latest.current.onSelect) { latest.current.onSelect(hitM.object.userData.id); return; }
          const hitG = raycaster.intersectObject(globe)[0];
          if (hitG && latest.current.onGlobeClick) {
            const c = vectorToGeographic(hitG.point);
            latest.current.onGlobeClick(body, c.lat, c.lon);
          }
        };

        renderer.domElement.addEventListener("pointerdown", onDown);
        renderer.domElement.addEventListener("pointermove", onMove);
        renderer.domElement.addEventListener("pointerup", onUp);

        let frameId = 0;
        const animate = () => {
          if (disposed) return;
          controls.update();
          lines.visible = latest.current.grid;
          markerGroup.visible = latest.current.markers;
          if (mat.map !== (latest.current.imagery ? loadedTex : null)) {
            mat.map = latest.current.imagery ? loadedTex : null;
            mat.needsUpdate = true;
          }
          const camDir = camera.position.clone().normalize();
          labelElements.forEach(({ el, pos, id }) => {
            const vis = latest.current.markers && pos.clone().normalize().dot(camDir) > 0.22;
            el.style.display = vis ? "block" : "none";
            if (vis) {
              const p = pos.clone().project(camera);
              el.style.left = ((p.x * 0.5 + 0.5) * container.clientWidth) + "px";
              el.style.top = ((-p.y * 0.5 + 0.5) * container.clientHeight) + "px";
              el.classList.toggle("selected", id === latest.current.selectedId);
            }
          });
          renderer.render(scene, camera);
          frameId = requestAnimationFrame(animate);
        };
        animate();

        return () => {
          disposed = true;
          cancelAnimationFrame(frameId);
          ro.disconnect();
          controls.dispose();
          labelElements.forEach((x) => x.el.remove());
          renderer.dispose();
          renderer.domElement.remove();
        };
      }, [body, centerLat, centerLon, customMarkers, splitBridgeCoords]);

      return h("div", { className: "planet-viewport" },
        h("div", { className: "planet-canvas", ref: hostRef }),
        h("div", { className: "viewport-caption" },
          h("span", { className: "status-dot" }),
          body === "Earth" ? "3B D\u00DCNYA ANALOG K\u00DCRES\u0130 (11,469 H\u00DCCRE)" : "3B " + body.toUpperCase() + " Y\u00DCZEY K\u00DCRES\u0130",
          hoverCoords && h("span", { style: { marginLeft: 10, color: "#8ce9d0", fontWeight: 600 } },
            "\uD83C\uDFAF \u0130MLE\u00C7: " + hoverCoords.lat + "\u00B0, " + hoverCoords.lon + "\u00B0 (K\u00FCreye T\u0131kla)"
          ),
          h("span", { className: "view-mode" }, "3D GLOBE")
        ),
        h("div", { className: "viewport-tools" },
          h("button", { title: "Odaklan", onClick: () => apiRef.current?.focus() }, "\u2316"),
          h("button", { title: "Yak\u0131nla\u015Ft\u0131r", onClick: () => apiRef.current?.zoom(0.8) }, "+"),
          h("button", { title: "Uzakla\u015Ft\u0131r", onClick: () => apiRef.current?.zoom(1.2) }, "\u2212"),
          h("button", { title: "S\u0131f\u0131rla", onClick: () => apiRef.current?.reset() }, "\u21BA")
        ),
        h("div", { className: "viewport-bottom" },
          h("span", null, body === "Earth" ? "NASA GIBS \u00B7 SRTM 90m DEM + NASA POWER" : "NASA TREK WMTS (G\u00F6rsel Ba\u011Flam)"),
          h("span", null, "S\u00FCr\u00FCkle: D\u00F6nd\u00FCr \u00B7 Tekerlek: Yak\u0131nla\u015Ft\u0131r \u00B7 T\u0131kla: Koordinat Se\u00E7")
        )
      );
    }

    function RadarChart6D({ targetName, targetVec, candidates, compSite }) {
      const size = 310, cx = 155, cy = 155, radius = 100;
      const labels = ["1. Bazalt/Albedo", "2. E\u011Fim (<5\u00B0)", "3. Radyatif", "4. So\u011Fuk Tuzak", "5. Kurakl\u0131k", "6. R\u00F6lyef (m)"];
      const pt = (i, v) => {
        const a = (Math.PI * 2 * i) / 6 - Math.PI / 2;
        const r = Math.max(0, Math.min(1, v)) * radius;
        return (cx + r * Math.cos(a)).toFixed(1) + "," + (cy + r * Math.sin(a)).toFixed(1);
      };
      const poly = (arr) => (arr || [0.5,0.5,0.5,0.5,0.5,0.5]).map((v, i) => pt(i, v)).join(" ");

      return h("div", null,
        h("svg", { viewBox: "0 0 " + size + " " + size, style: { width: "100%", maxHeight: 280 } },
          [0.25, 0.5, 0.75, 1.0].map((lvl) =>
            h("polygon", { key: lvl, points: [0,1,2,3,4,5].map((i) => pt(i, lvl)).join(" "), fill: "none", stroke: "#263544" })
          ),
          [0,1,2,3,4,5].map((i) => {
            const a = (Math.PI * 2 * i) / 6 - Math.PI / 2;
            return h("g", { key: i },
              h("line", { x1: cx, y1: cy, x2: cx + radius * Math.cos(a), y2: cy + radius * Math.sin(a), stroke: "#2b3d4f" }),
              h("text", { x: cx + (radius + 28) * Math.cos(a), y: cy + (radius + 18) * Math.sin(a), fill: "#c2d4e6", fontSize: "9.5", textAnchor: "middle" }, labels[i])
            );
          }),
          h("polygon", { points: poly(targetVec), fill: "rgba(0, 212, 255, 0.22)", stroke: "#00d4ff", strokeWidth: 2.4 }),
          candidates[0] && h("polygon", { points: poly(candidates[0].features_6d), fill: "rgba(255, 159, 28, 0.18)", stroke: "#ff9f1c", strokeWidth: 2.2 }),
          compSite?.features_6d && h("polygon", { points: poly(compSite.features_6d), fill: "none", stroke: "#00f5d4", strokeWidth: 1.8, strokeDasharray: "4 3" })
        ),
        h("div", { style: { display: "flex", gap: 12, justifyContent: "center", fontSize: 10.5, flexWrap: "wrap" } },
          h("span", { style: { color: "#00d4ff" } }, "\u25CF HEDEF: " + (targetName || "").slice(0, 24)),
          candidates[0] && h("span", { style: { color: "#ff9f1c" } }, "\u25CF #1: " + candidates[0].region_name.split("[")[0].trim()),
          compSite && h("span", { style: { color: "#00f5d4" } }, "\u2508 \u0130kili Saha: " + compSite.complementary_region_name.split("[")[0].trim())
        )
      );
    }

    function CrossSectionChart2D({ target, cand }) {
      const tCs = target?.cross_section;
      const eCs = cand?.cross_section;
      if (!tCs || !eCs) return null;
      const w = 450, hSvg = 240, padL = 42, padR = 16, padT = 24, padB = 34;
      const plotW = w - padL - padR, plotH = hSvg - padT - padB;
      const tElev = tCs.elevation_m || [], eElev = eCs.elevation_m || [], dists = eCs.distances_km || [];
      const maxElev = Math.max(10, ...tElev, ...eElev);
      const maxDist = Math.max(1, ...(dists.length ? dists : [10]));
      const makePath = (arr) => arr.map((v, i) => (i === 0 ? "M" : "L") + (padL + (i / Math.max(1, arr.length - 1)) * plotW).toFixed(1) + "," + (padT + plotH - (v / maxElev) * plotH).toFixed(1)).join(" ");
      const bestKm = Number(eCs.best_base_km ?? maxDist / 2);
      const bestIdx = Math.min(eElev.length - 1, Math.max(0, Math.round((bestKm / maxDist) * (eElev.length - 1))));
      const bestX = padL + (bestIdx / Math.max(1, eElev.length - 1)) * plotW;
      const bestY = padT + plotH - ((eElev[bestIdx] || 0) / maxElev) * plotH;

      return h("div", null,
        h("svg", { viewBox: "0 0 " + w + " " + hSvg, style: { width: "100%", maxHeight: 270 } },
          [0, 0.25, 0.5, 0.75, 1].map((f) => {
            const y = padT + plotH - f * plotH;
            return h("g", { key: f },
              h("line", { x1: padL, y1: y, x2: w - padR, y2: y, stroke: "#233240" }),
              h("text", { x: padL - 6, y: y + 3, fill: "#9ab0c4", fontSize: "9", textAnchor: "end" }, Math.round(f * maxElev) + "m")
            );
          }),
          tCs.mean_slope_deg !== null && h("path", { d: makePath(tElev), fill: "none", stroke: "#00d4ff", strokeWidth: 2.2 }),
          eCs.mean_slope_deg !== null && h("path", { d: makePath(eElev), fill: "none", stroke: "#ff9f1c", strokeWidth: 2.2 }),
          h("circle", { cx: bestX, cy: bestY, r: 5.5, fill: "#00f5d4", stroke: "#fff", strokeWidth: 1.5 }),
          h("text", { x: bestX, y: Math.max(14, bestY - 8), fill: "#00f5d4", fontSize: "9.5", textAnchor: "middle" }, "\u2605 D\u00DC\u015E\u00DCK E\u011E\u0130M PENCERES\u0130 (" + bestKm + " km)"),
          h("text", { x: w / 2, y: hSvg - 6, fill: "#9ab0c4", fontSize: "9", textAnchor: "middle" }, "Taktik Kesit Mesafesi (0 \u2014 " + maxDist.toFixed(0) + " km) \u00B7 " + (eCs.dem_source || "").slice(0, 44))
        ),
        h("div", { style: { display: "flex", gap: 14, justifyContent: "center", fontSize: 10.5, flexWrap: "wrap" } },
          h("span", { style: { color: "#00d4ff" } }, "\u2501 " + target.body + " Hedef (E\u011Fim: " + (tCs.mean_slope_deg ?? "Veri Yok") + "\u00B0 | R\u00F6lyef: " + (tCs.relief_m ?? "Veri Yok") + " m)"),
          h("span", { style: { color: "#ff9f1c" } }, "\u2501 D\u00FCnya SRTM 90m DEM (E\u011Fim: " + (eCs.mean_slope_deg ?? "Veri Yok") + "\u00B0 | <5\u00B0 Oran\u0131: %" + (eCs.safe_landing_pct ?? "N/A") + ")")
        )
      );
    }

    function App() {
      const [body, setBody] = useState("Earth");
      const [split, setSplit] = useState(true);
      const [imagery, setImagery] = useState(true);
      const [grid, setGrid] = useState(true);
      const [markers, setMarkers] = useState(true);

      const [selectionMode, setSelectionMode] = useState("PRESET");
      const [presetId, setPresetId] = useState("MOON_MARE_TRANQUILLITATIS_PIT");
      const [dynBody, setDynBody] = useState("Mars");
      const [dynLat, setDynLat] = useState(-13.8);
      const [dynLon, setDynLon] = useState(-61.2);
      const [radiusKm, setRadiusKm] = useState(5.0);
      const [missionMode, setMissionMode] = useState("HABITAT_LAVA_TUBE");
      const [customWeights, setCustomWeights] = useState([0.25, 0.20, 0.15, 0.15, 0.10, 0.15]);
      const [noveltyOnly, setNoveltyOnly] = useState(true);
      const [minSepKm, setMinSepKm] = useState(450);

      const [apiData, setApiData] = useState(null);
      const [loading, setLoading] = useState(false);
      const [selectedCandIdx, setSelectedCandIdx] = useState(0);
      const [showHud, setShowHud] = useState(true);
      const [activeTab, setActiveTab] = useState(1);

      async function runAnalysis(overrides = {}) {
        setLoading(true);
        const payload = {
          selection_mode: overrides.selection_mode ?? selectionMode,
          preset_id: overrides.preset_id ?? presetId,
          body: overrides.body ?? (selectionMode === "PRESET" ? (PRESET_CATALOG.find((p) => p.id === presetId)?.body || "Moon") : dynBody),
          lat: overrides.lat ?? dynLat,
          lon: overrides.lon ?? dynLon,
          radius_km: overrides.radius_km ?? radiusKm,
          mission_mode: overrides.mission_mode ?? missionMode,
          custom_weights: overrides.custom_weights ?? customWeights,
